<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>Точка перехода</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Стили -->
  <link rel="stylesheet" href="style.css">
</head>


<body>

  <div class="app">

    <!-- =========================
         ШАПКА
    ========================== -->

    <header class="hero">

      <div class="portal"></div>

      <div class="hero-copy">

        <div class="eyebrow">
          АВТОРСКОЕ ПРОСТРАНСТВО
        </div>

        <h1>
          ТОЧКА<br>
          <span>ПЕРЕХОДА</span>
        </h1>

        <p>
          Осознанность · Свобода · Трансформация · Результат
        </p>

      </div>

    </header>


    <!-- =========================
         ГЛАВНАЯ
    ========================== -->

    <main
      id="screen-home"
      class="screen active"
    >

      <section class="intro">

        <h2>
          Новый этап начинается здесь.
        </h2>

        <p>
          Узнай, где ты находишься сейчас,
          и сделай следующий шаг.
        </p>

      </section>


      <div class="cards">


        <!-- ТЕСТ -->

        <button
          class="card accent"
          onclick="showScreen('test')"
        >

          <span class="icon">
            🔥
          </span>

          <b>
            ТЕСТ
          </b>

          <small>
            Бесплатно определяет,
            на какой ступени осознанности
            ты находишься сейчас.
          </small>

        </button>


        <!-- МОЙ ПУТЬ -->

        <button
          class="card"
          onclick="showScreen('cabinet')"
        >

          <span class="icon">
            ◈
          </span>

          <b>
            МОЙ ПУТЬ
          </b>

          <small>
            Здесь сохраняется твой прогресс
            и открываются доступные этапы
            твоего перехода.
          </small>

        </button>


        <!-- КОНСУЛЬТАЦИЯ -->

        <button
          class="card"
          onclick="openConsultation()"
        >

          <span class="icon">
            ◇
          </span>

          <b>
            КОНСУЛЬТАЦИЯ
          </b>

          <small>
            Разбор твоей ситуации за 60–90 минут —
            чтобы увидеть главное
            и понять, что делать дальше.
          </small>

        </button>


        <!-- СОПРОВОЖДЕНИЕ -->

        <button
          class="card"
          onclick="openAccompaniment()"
        >

          <span class="icon">
            ✦
          </span>

          <b>
            ЛИЧНОЕ СОПРОВОЖДЕНИЕ
          </b>

          <small>
            Персональная работа со мной —
            шаг за шагом, с фокусом
            на твою ситуацию и изменения.
          </small>

        </button>


      </div>

    </main>


    <!-- =========================
         ТЕСТ
    ========================== -->

    <main
      id="screen-test"
      class="screen"
    >

      <button
        class="back"
        onclick="showScreen('home')"
      >
        ← Назад
      </button>

      <div id="test-wrap"></div>

    </main>


    <!-- =========================
         ЛИЧНЫЙ КАБИНЕТ
    ========================== -->

    <main
      id="screen-cabinet"
      class="screen"
    >

      <button
        class="back"
        onclick="showScreen('home')"
      >
        ← Назад
      </button>

      <div id="cabinet-wrap"></div>

    </main>


  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>

</html>
