<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Точка перехода</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="portal"></div>
      <div class="hero-copy">
        <div class="eyebrow">АВТОРСКОЕ ПРОСТРАНСТВО</div>
        <h1>ТОЧКА<br><span>ПЕРЕХОДА</span></h1>
        <p>Осознанность · Свобода · Трансформация · Результат</p>
      </div>
    </header>

    <main id="screen-home" class="screen active">
      <section class="intro">
        <h2>Новый этап начинается здесь.</h2>
        <p>Узнай, где ты находишься сейчас, и сделай следующий шаг.</p>
      </section>
      <div class="cards">
        <button class="card accent" onclick="showScreen('test')">
          <span class="icon">🔥</span><b>Пройти тест</b><small>«Переход — где ты сейчас?»</small>
        </button>
        <button class="card" onclick="openConsultation()">
          <span class="icon">◇</span><b>КОНСУЛЬТАЦИЯ</b><small>Разбор твоей ситуации за 60–90 минут.</small>
        </button>
        <button class="card" onclick="openAccompaniment()">
          <span class="icon">✦</span><b>ЛИЧНОЕ СОПРОВОЖДЕНИЕ</b><small>Персональная работа со мной шаг за шагом.</small>
        </button>
        <button class="card" onclick="openCabinet()">
          <span class="icon">◈</span><b>МОЙ ПУТЬ</b><small>Твои 7 этапов и сохранённый прогресс.</small>
        </button>
      </div>
    </main>

    <main id="screen-test" class="screen">
      <button class="back" onclick="showScreen('home')">← Назад</button>
      <div id="test-wrap"></div>
    </main>

    <main id="screen-cabinet" class="screen">
      <button class="back" onclick="showScreen('home')">← Назад</button>
      <div class="cabinet"><div class="tag">ТВОЙ ЛИЧНЫЙ ПУТЬ</div><h2 id="cabinet-stage">Загрузка...</h2><div class="progress-track"><div id="cabinet-progress" class="progress-fill"></div></div><div id="cabinet-progress-text" class="progress-text">Загрузка...</div><div id="cabinet-message" class="cabinet-message"></div><div class="stages-title">7 ЭТАПОВ ПЕРЕХОДА</div><div id="stage-list" class="stage-list"></div></div>
    </main>
    <main id="screen-lesson" class="screen"><button class="back" onclick="openCabinet()">← К этапам</button><div id="lesson-wrap"></div></main>
    <nav class="bottom-nav">
      <button onclick="showScreen('home')">⌂<span>Главная</span></button>
      <button onclick="showScreen('test')">✦<span>Тест</span></button>
      <button onclick="openCabinet()">◈<span>Мой путь</span></button>
      <button onclick="openConsultation()">◇<span>Приём</span></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
